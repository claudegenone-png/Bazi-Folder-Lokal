<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Properti (田宅) Palace</title>
<link rel="stylesheet" href="style.css">
<style>
  .content-pal { grid-template-rows: 1fr !important; gap: 0; }

  .palace-solo {
    background: linear-gradient(180deg, #FFF8E1, #FBF1D4);
    border: 0.6mm solid var(--gold);
    border-radius: 2.5mm;
    padding: 6mm 8mm;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    gap: 3mm;
    
    position: relative;
  }
  .palace-solo::before {
    content: ''; position: absolute;
    top: 0; right: 0; width: 28mm; height: 28mm;
    background-color: transparent;
    background-image: radial-gradient(circle at top right, rgba(201,169,97,0.22) 0%, transparent 60%);
    pointer-events: none;
  }

  .ps-head {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: baseline;
    gap: 4mm;
    border-bottom: 0.3mm solid var(--gold);
    padding-bottom: 2.5mm;
  }
  .ps-title-id {
    font-family: 'Playfair Display', serif;
    font-size: 24pt;
    color: var(--red);
    font-weight: 700;
    letter-spacing: 0.5px;
    line-height: 1;
  }
  .ps-title-hz {
    font-family: 'Noto Serif TC', serif;
    font-size: 22pt;
    color: var(--text);
    font-weight: 700;
    letter-spacing: 4px;
    line-height: 1;
  }
  .ps-title-pinyin {
    font-family: 'Inter', sans-serif;
    font-size: 9pt;
    color: var(--text-muted);
    font-style: italic;
    letter-spacing: 0.5px;
    margin-top: 1mm;
  }
  .ps-badge {
    font-family: 'Inter', sans-serif;
    font-size: 7pt;
    color: white;
    background: var(--red);
    padding: 1mm 3mm;
    border-radius: 1mm;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .ps-meta-row {
    display: flex;
    gap: 4mm;
    align-items: center;
    font-size: 8.5pt;
    color: var(--text-muted);
    padding-bottom: 1.5mm;
  }
  .ps-meta-row .lbl {
    font-family: 'Inter', sans-serif;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 6.5pt;
    color: #8B7355;
    font-weight: 600;
  }
  .ps-meta-row .val {
    font-family: 'Noto Serif TC', serif;
    color: var(--text);
    font-weight: 600;
  }

  .ps-body {
    overflow: hidden;
    font-size: 9.5pt;
    line-height: 1.45;
    color: var(--text);
    
    text-align: justify;
    padding: 0 1mm;
  }
  .ps-body p {
    margin: 0 0 2mm 0;
  }
  .ps-body p:last-child {
    margin-bottom: 0;
  }
  .ps-body strong {
    color: var(--red);
    font-weight: 700;
  }
  .ps-body .hz {
    font-family: 'Noto Serif TC', serif;
    color: var(--red);
    font-weight: 600;
  }

  .ps-action {
    display: grid;
    grid-template-columns: 6mm 1fr;
    gap: 3mm;
    background: rgba(45,106,79,0.08);
    border-left: 0.7mm solid var(--green);
    border-radius: 0 1.5mm 1.5mm 0;
    padding: 3mm 4mm;
    font-size: 9pt;
    line-height: 1.5;
    color: var(--text);
  }
  .ps-action .ps-action-ico {
    color: var(--green);
    font-weight: 700;
    font-size: 12pt;
    line-height: 1;
  }
  .ps-action .ps-action-content {
    display: grid;
    gap: 1mm;
  }
  .ps-action .ps-action-label {
    font-family: 'Inter', sans-serif;
    font-size: 7.5pt;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--green);
    font-weight: 700;
  }
</style>
</head>
<body>
<section class="page">
  <header class="page-header">
    <div class="h-num">{{PAGE_NUM_PADDED}}</div>
    <div class="h-titles"><div class="h-cn">田宅</div><div class="h-id">Properti · Istana 10 · Lingkar Properti</div></div>
    <div class="h-section">Bagian II · Zi Wei 紫微</div>
  </header>

  <div class="subject-bar">
    <div class="subject-shio"><img src="Babi-Merah.svg" alt="Babi"></div>
    <div class="subject-meta">
      <div class="subject-name">Lin Ru Yi · <span style="font-family:'Noto Serif TC',serif;color:var(--red)">亥 Babi</span></div>
      <div class="subject-detail">Aset tetap, properti, & warisan tanah</div>
    </div>
    <div class="subject-dm"><div class="label">Penguasa Hari</div><div class="value">辛金 · Logam Halus</div></div>
  </div>

  <main class="content content-pal">
    <div class="palace-solo">
      <div class="ps-head">
        <div>
          <div class="ps-title-id">Properti</div>
          <div class="ps-title-pinyin">Tián Zhái</div>
        </div>
        <div style="text-align:center;">
          <div class="ps-title-hz">田宅</div>
        </div>
        <div class="ps-badge">Lingkar Properti</div>
      </div>

      <div class="ps-meta-row">
        <span class="lbl">Sumber Foto</span>
        <span class="val">田宅 layar 詳細解説</span>
      </div>

      <div class="ps-body"><!-- TAFSIR:_solo_tianzhai_body --><p>&mdash;</p><!-- /TAFSIR --></div>

      <div class="ps-action">
        <div class="ps-action-ico">&#9656;</div>
        <div class="ps-action-content">
          <div class="ps-action-label">Saran Tindakan</div>
          <div><!-- TAFSIR:_solo_tianzhai_action -->&mdash;<!-- /TAFSIR --></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-meta"><span>Halaman {{PAGE_NUM}} / {{TOTAL_PAGES}}</span></div>
  </footer>
</section>
</body>
</html>
